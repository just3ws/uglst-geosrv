name: CD Placeholder

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.8
          bundler-cache: true

      - name: Run tests before packaging
        run: bundle exec rspec

      - name: Build source artifact
        run: |
          set -euo pipefail
          ARTIFACT_NAME="uglst-geosrv-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --output "$ARTIFACT_NAME" HEAD
          shasum -a 256 "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-bundle-${{ github.sha }}
          path: |
            uglst-geosrv-${{ github.sha }}.tar.gz
            uglst-geosrv-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
